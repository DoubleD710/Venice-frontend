<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Venice</title>
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/water-canvas.css">
    <link rel="stylesheet" href="./styles/fusion-input.css">
  </head>
  <body>
    <canvas class="water-canvas" data-water-canvas aria-hidden="true"></canvas>

    <main class="app-shell">
      <div class="app-stack">
        <section class="fusion-box" data-fusion-box>
          <div class="fusion-box__header">
            <p class="eyebrow">Venice</p>
            <button class="mode-toggle" type="button" data-mode-toggle aria-pressed="false">
              Focus
            </button>
          </div>

          <label class="fusion-box__label" for="venice-input">Local prompt</label>
          <textarea
            class="fusion-box__input"
            id="venice-input"
            data-fusion-input
            rows="5"
            placeholder="Ask Venice to think with the room."
          ></textarea>

          <section class="provider-settings" data-provider-settings>
            <div class="provider-settings__grid">
              <label>
                Provider
                <select data-provider-select></select>
              </label>
              <label>
                Model
                <input type="text" data-provider-model autocomplete="off">
              </label>
              <label>
                Endpoint
                <input type="url" data-provider-endpoint autocomplete="off">
              </label>
              <label data-api-key-group>
                API key
                <input type="password" data-provider-api-key autocomplete="off">
              </label>
            </div>
            <div class="provider-settings__actions">
              <span class="provider-settings__key-status" data-api-key-status>No key saved</span>
              <span class="provider-settings__capability-status" data-capability-status>stream</span>
              <button type="button" data-clear-provider-key>Clear key</button>
              <button type="button" data-save-provider-settings>Save settings</button>
            </div>
          </section>
        </section>

        <section class="response-panel" data-response-panel aria-live="polite">
          <div class="response-panel__header">
            <p class="eyebrow">Response</p>
            <div class="status-bar" data-status-bar>Idle</div>
            <div class="response-panel__actions">
              <button class="response-panel__clear" type="button" data-clear-conversation>
                Clear
              </button>
              <button class="response-panel__stop" type="button" data-stop-generation disabled>
                Stop
              </button>
            </div>
          </div>
          <div class="response-panel__output" data-response-output></div>
        </section>
      </div>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
